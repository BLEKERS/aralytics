services:
  postgres:
    image: postgres:16
    container_name: aralytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aralytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    image: aralytics-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aralytics-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-please-0123456789}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      ACTIVATION_TOKEN_TTL_MINUTES: ${ACTIVATION_TOKEN_TTL_MINUTES:-15}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-15}
      INTERVENTION_THRESHOLD: ${INTERVENTION_THRESHOLD:-70}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:
