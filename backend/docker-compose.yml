services:
  postgres:
    image: postgres:16
    container_name: aralytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aralytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aralytics-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/aralytics
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a unique secret of at least 32 bytes}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      ACTIVATION_TOKEN_TTL_MINUTES: ${ACTIVATION_TOKEN_TTL_MINUTES:-15}
      INTERVENTION_THRESHOLD: ${INTERVENTION_THRESHOLD:-70}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
