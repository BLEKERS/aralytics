services:
  mysql:
    image: mysql:8.4
    container_name: aralytics-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aralytics
      MYSQL_USER: ${DB_USERNAME:-aralytics}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aralytics}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "3306:3306"
    volumes:
      - aralytics-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aralytics-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/aralytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-aralytics}
      DB_PASSWORD: ${DB_PASSWORD:-aralytics}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a unique secret of at least 32 bytes}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      ACTIVATION_TOKEN_TTL_MINUTES: ${ACTIVATION_TOKEN_TTL_MINUTES:-15}
      INTERVENTION_THRESHOLD: ${INTERVENTION_THRESHOLD:-70}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "8080:8080"

volumes:
  aralytics-mysql-data:
