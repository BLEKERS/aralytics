# Integration tests run against H2 in PostgreSQL mode. Flyway is disabled because
# the test schema is generated by Hibernate and data.sql loads the demo fixtures.
# The production schema and seed are covered by EndToEndPostgresTest.
spring:
  datasource:
    url: jdbc:h2:mem:aralytics_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

aralytics:
  jwt:
    secret: integration-test-secret-integration-test-secret-0123456789
    expiration-minutes: 60
  activation:
    token-ttl-minutes: 15
  intervention:
    threshold: 70
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    root: WARN
    ph.aralytics.backend: INFO
