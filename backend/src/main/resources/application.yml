server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: aralytics-backend
  profiles:
    active: ${ENV:development}
    group:
      development:
        - dev
        - seed
      dev:
        - dev
        - seed
      production:
        - prod
      prod:
        - prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/aralytics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema (see db/migration).
      # Hibernate's dialect is auto-detected from the JDBC driver; no explicit dialect.
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

aralytics:
  jwt:
    # Must be at least 32 bytes. Override in every real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  activation:
    token-ttl-minutes: ${ACTIVATION_TOKEN_TTL_MINUTES:15}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  intervention:
    threshold: ${INTERVENTION_THRESHOLD:70}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
