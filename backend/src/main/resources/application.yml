server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: aralytics-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aralytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:aralytics}
    password: ${DB_PASSWORD:aralytics}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema (see db/migration).
      # Validation is intentionally off: the ERD uses camelCase MySQL identifiers and
      # Hibernate's MySQL/H2 type names differ enough that strict validation produces
      # false drift reports. Migrations are covered by MySQLMigrationIT instead.
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

aralytics:
  jwt:
    # Must be at least 32 bytes. Override in every real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  activation:
    student-key: ${ACTIVATION_STUDENT_KEY:KEY-8821-PY}
    teacher-key: ${ACTIVATION_TEACHER_KEY:FAC-2025-DEPED}
    token-ttl-minutes: ${ACTIVATION_TOKEN_TTL_MINUTES:15}
  intervention:
    threshold: ${INTERVENTION_THRESHOLD:70}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
