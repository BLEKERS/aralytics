# Production profile: no seed data, no API documentation UI, conservative logging.
# Supply JWT_SECRET and DB_* through the environment. Activation keys live per school in
# the SCHOOL table and are provisioned out-of-band.
# Password reset links use aralytics.password-reset.frontend-base-url.
# Set FRONTEND_BASE_URL to the deployed frontend origin in production.
spring:
  flyway:
    locations: classpath:db/migration
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    ph.aralytics.backend: INFO
