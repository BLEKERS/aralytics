# Development profile: applies schema migrations plus the idempotent demo seed and
# exposes Swagger UI. Never use this profile in production.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aralytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "" 
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    ph.aralytics.backend: DEBUG
    org.flywaydb: INFO